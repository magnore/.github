name: "✨ Proponer una mejora"
description: Una idea para mejorar un plugin o funcionalidad existente.
title: "[Mejora] "
labels: ["enhancement"]
body:
  - type: textarea
    id: necesidad
    attributes:
      label: ¿Qué necesidad o problema resuelve?
      description: Explica la situación actual y por qué conviene cambiarla.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo te imaginas la mejora. Puedes adjuntar bocetos o capturas.
    validations:
      required: true
  - type: dropdown
    id: origen
    attributes:
      label: ¿De dónde sale la idea?
      options:
        - Uso interno
        - La ha pedido un cliente
        - Otra
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad sugerida
      options:
        - Alta
        - Normal
        - Baja
  - type: textarea
    id: notas
    attributes:
      label: Notas adicionales
