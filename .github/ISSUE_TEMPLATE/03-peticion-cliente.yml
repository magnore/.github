name: "📋 Petición de cliente"
description: Un cliente pide un cambio, un desarrollo nuevo o una configuración.
title: "[Cliente] "
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla para registrar lo que pide un cliente. **No incluyas datos personales** de sus usuarios.
  - type: input
    id: cliente
    attributes:
      label: Cliente
    validations:
      required: true
  - type: input
    id: solicitante
    attributes:
      label: Quién lo pide y por qué canal
      placeholder: "Ej.: coordinadora de formación, por correo del 25/11"
  - type: textarea
    id: peticion
    attributes:
      label: ¿Qué pide?
      description: Describe la petición con el máximo detalle posible.
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha deseada
      placeholder: "Ej.: antes del 15/01"
  - type: dropdown
    id: facturable
    attributes:
      label: ¿Es facturable?
      options:
        - Por valorar
        - Sí
        - "No"
  - type: textarea
    id: adjuntos
    attributes:
      label: Documentación o capturas
